<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#102A56"/>
      <stop offset="100%" stop-color="#183D73"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D78E"/>
      <stop offset="100%" stop-color="#D6A84B"/>
    </linearGradient>
  </defs>
  <!-- Navy rounded square background -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Subtle inner border -->
  <rect x="1" y="1" width="62" height="62" rx="13" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1"/>
  <!-- π symbol paths: horizontal bar + left stem + right stem -->
  <!-- Top bar -->
  <path d="M14 21 C14 18.2 16.2 16.5 19 16.5 H50" stroke="url(#gold)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Left stem (vertical) -->
  <path d="M23 16.5 V47.5" stroke="url(#gold)" stroke-width="3.2" stroke-linecap="round" fill="none"/>
  <!-- Right stem (vertical, curves at bottom like π) -->
  <path d="M38 16.5 V42 C38 45 40.5 47.5 43.5 47.5" stroke="url(#gold)" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>

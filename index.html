<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102A56" />
    <meta
      name="description"
      content="High School Math is a modern mathematics library for Grades 7–12: formulas, theory, worked examples, exercises, and an interactive Shape Lab."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/png" href="/img/pi.png" />
    <link rel="icon" type="image/png" sizes="128x128" href="/img/pi.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/img/pi.png" />
    <link rel="apple-touch-icon" href="/img/pi.png" />
    <title>High School Math — Formulas, Theory &amp; Shapes, Grades 7–12</title>
    <script>
      // Apply the saved theme and language before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('axiom.theme.v1')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#091B38' : '#102A56')
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
        try {
          var lang = localStorage.getItem('axiom.lang.v1')
          if (lang !== 'km' && lang !== 'en') lang = 'en'
          document.documentElement.lang = lang
          document.documentElement.setAttribute('data-lang', lang)
        } catch (error) {
          document.documentElement.lang = 'en'
          document.documentElement.setAttribute('data-lang', 'en')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#102A56" />
    <meta name="color-scheme" content="light dark" />
    <meta name="google-site-verification" content="1iTKwNVl9rQdavMT2BrVnM1tq3mf3-RB2G0A5yN48hE" />
    <meta name="msvalidate.01" content="EBCA5D7316B137603F51B6A3C9BA9265" />
    <!--
      Route-specific tags. In production every page's region is replaced at
      build time by scripts/prerender.ts; at runtime <SeoHead> keeps them in
      sync. The defaults below describe the home page (used by `npm run dev`).
    -->
    <!--seo:start-->
    <title>High School Math - Grade 7–12 Mathematics for Cambodian Students</title>
    <meta
      name="description"
      content="Free English and Khmer mathematics library for Cambodian students in Grades 7–12: formulas, lessons with worked examples and exercises, BacII exam guides and an interactive Shape Lab."
    />
    <meta
      name="keywords"
      content="High School Math, Math High School Cambodia, Cambodian Mathematics, Khmer Mathematics, Mathematics Grade 7-12, MoEYS math, BacII math, គណិតវិទ្យា ថ្នាក់ទី៧-១២, បាក់ឌុប, រូបមន្តគណិតវិទ្យា, ប្រឡងបាក់ឌុប"
    />
    <meta name="author" content="High School Math Cambodia" />
    <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
    <link rel="canonical" href="https://math-high-school.vercel.app/" />
    <meta property="og:site_name" content="High School Math" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="High School Math - Grade 7–12 Mathematics for Cambodian Students" />
    <meta property="og:url" content="https://math-high-school.vercel.app/" />
    <meta property="og:image" content="https://math-high-school.vercel.app/og-image.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <!--seo:end-->
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" type="image/png" sizes="48x48" href="/icons/pi-48.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/pi-192.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/icons/pi-96.png" data-theme-icon />
    <link rel="apple-touch-icon" sizes="180x180" href="/icons/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <style>
      /* Prerendered first paint: show static content without entrance animations. */
      html[data-boot] .page-enter,
      html[data-boot] .hero__rise {
        animation: none !important;
      }
      html[data-boot] .reveal {
        opacity: 1 !important;
        transform: none !important;
        transition: none !important;
      }
      /* Static HTML is English; Khmer readers wait for the client render instead of a language flash. */
      html[data-lang='km'] [data-ssr] {
        visibility: hidden;
      }
    </style>
    <script>
      // Apply the saved theme and language before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('axiom.theme.v1')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#091B38' : '#102A56')
          var themeIcon = document.querySelector('link[data-theme-icon]')
          if (themeIcon) themeIcon.setAttribute('href', theme === 'dark' ? '/icons/pi-dark-96.png' : '/icons/pi-96.png')
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
        try {
          var lang = localStorage.getItem('axiom.lang.v1')
          if (lang !== 'km' && lang !== 'en') lang = 'en'
          document.documentElement.lang = lang
          document.documentElement.setAttribute('data-lang', lang)
        } catch (error) {
          document.documentElement.lang = 'en'
          document.documentElement.setAttribute('data-lang', 'en')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"><!--app-html--></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

    <script>
      // Apply the saved theme and language before first paint to avoid a flash.
      (function () {
        try {
          var stored = localStorage.getItem('axiom.theme.v1')
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches
          var theme = stored === 'light' || stored === 'dark' ? stored : prefersDark ? 'dark' : 'light'
          document.documentElement.setAttribute('data-theme', theme)
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', theme === 'dark' ? '#091B38' : '#102A56')
          var iconHref = theme === 'dark' ? '/img/white-pi.png' : '/img/pi.png'
          var iconLinks = document.querySelectorAll('link[rel*="icon"], link[rel="apple-touch-icon"]')
          for (var i = 0; i < iconLinks.length; i++) {
            iconLinks[i].setAttribute('href', iconHref)
          }
        } catch (error) {
          document.documentElement.setAttribute('data-theme', 'light')
        }
        try {
          var lang = localStorage.getItem('axiom.lang.v1')
          if (lang !== 'km' && lang !== 'en') lang = 'en'
          document.documentElement.lang = lang
          document.documentElement.setAttribute('data-lang', lang)
        } catch (error) {
          document.documentElement.lang = 'en'
          document.documentElement.setAttribute('data-lang', 'en')
        }
      })()
    </script>
